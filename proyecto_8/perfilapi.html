<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.18.1/axios.js"></script>
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
 
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #ffffff;
            color: #333333;
        }
 
        .tarjeta {
            width: 100%;
            margin: 0;
            border: 1px solid #dddddd;
            overflow: hidden;
        }
 
        .encabezado {
            background-color: #062e56;
            color: #ffffff;
            padding: 30px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
 
        .encabezado #titulo {
            font-size: 15px;
            font-weight: normal;
            margin-bottom: 5px;
        }
 
        .encabezado #nombre,
        .encabezado #apellido {
            font-size: 34px;
            font-weight: bold;
            line-height: 1.3;
        }
 
        #perfil {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 3px solid #ffffff;
            object-fit: cover;
            margin-bottom: 15px;
        }
 
        .contenido {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0;
        }
 
        .seccion {
            padding: 25px 40px;
            border-bottom: 1px solid #eeeeee;
        }
 
        .seccion:nth-child(odd) {
            border-right: 1px solid #eeeeee;
        }
 
        .seccion h3 {
            font-size: 14px;
            color: #888888;
            margin-bottom: 15px;
            font-weight: normal;
        }
 
        .fila {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #f2f2f2;
            font-size: 14px;
        }
 
        .fila:last-child {
            border-bottom: none;
        }
 
        .etiqueta {
            color: #817f7f;
        }
 
        .valor {
            font-weight: bold;
            text-align: right;
        }
    </style>
</head>
<body>
    <div class="tarjeta">
        <div class="encabezado">
            <img id="perfil" alt="foto de perfil">
            <h1 id="titulo"></h1>
            <h1 id="nombre"></h1>
            <h1 id="apellido"></h1>
        </div>
 
        <div class="contenido">
            <div class="seccion">
                <h3>Contacto</h3>
                <div class="fila">
                    <span class="etiqueta">Email</span>
                    <span class="valor" id="correo"></span>
                </div>
                <div class="fila">
                    <span class="etiqueta">Teléfono</span>
                    <span class="valor" id="telefono"></span>
                </div>
                <div class="fila">
                    <span class="etiqueta">Celular</span>
                    <span class="valor" id="celular"></span>
                </div>
            </div>
 
            <div class="seccion">
                <h3>Personal</h3>
                <div class="fila">
                    <span class="etiqueta">Género</span>
                    <span class="valor" id="genero"></span>
                </div>
                <div class="fila">
                    <span class="etiqueta">Edad</span>
                    <span class="valor" id="años"></span>
                </div>
                <div class="fila">
                    <span class="etiqueta">Fecha de Nac.</span>
                    <span class="valor" id="fechan"></span>
                </div>
                <div class="fila">
                    <span class="etiqueta">Nacionalidad</span>
                    <span class="valor" id="nacionalidad"></span>
                </div>
                <div class="fila">
                    <span class="etiqueta" id="idnombre">NIT</span>
                    <span class="valor" id="nit"></span>
                </div>
            </div>
 
            <div class="seccion">
                <h3>Ubicación</h3>
                <div class="fila">
                    <span class="etiqueta">Dirección</span>
                    <span class="valor"><span id="calle"></span> <span id="numero"></span></span>
                </div>
                <div class="fila">
                    <span class="etiqueta">Ciudad</span>
                    <span class="valor" id="ciudad"></span>
                </div>
                <div class="fila">
                    <span class="etiqueta">País</span>
                    <span class="valor" id="pais"></span>
                </div>
                <div class="fila">
                    <span class="etiqueta">Código postal</span>
                    <span class="valor" id="codigopostal"></span>
                </div>
                <div class="fila">
                    <span class="etiqueta">Coordenadas</span>
                    <span class="valor"><span id="latitud"></span>, <span id="longitud"></span></span>
                </div>
                <div class="fila">
                    <span class="etiqueta">Zona horaria</span>
                    <span class="valor" id="descripcionzona"></span>
                </div>
            </div>
 
            <div class="seccion">
                <h3>Cuenta</h3>
                <div class="fila">
                    <span class="etiqueta">Usuario</span>
                    <span class="valor" id="usuario"></span>
                </div>
                <div class="fila">
                    <span class="etiqueta">Contraseña</span>
                    <span class="valor" id="password"></span>
                </div>
                <div class="fila">
                    <span class="etiqueta">UUID</span>
                    <span class="valor" id="uuid"></span>
                </div>
                <div class="fila">
                    <span class="etiqueta">Registrado hace</span>
                    <span class="valor"><span id="edadregistro"></span> años (<span id="registro"></span>)</span>
                </div>
                <div class="fila">
                    <span class="etiqueta">Zona</span>
                    <span class="valor" id="zona"></span>
                </div>
            </div>
        </div>
    </div>
 
<script>
    document.addEventListener("DOMContentLoaded", async () => {
        let res = await axios.get("https://randomuser.me/api/")
        console.log(res);
        let nombre = document.getElementById("nombre")
        nombre.textContent = res.data.results[0].name.first
 
        let apellido = document.getElementById("apellido")
        apellido.textContent = res.data.results[0].name.last
 
        let titulo = document.getElementById("titulo")
        titulo.textContent = res.data.results[0].name.title
 
        let perfil = document.getElementById("perfil")
        perfil.src = res.data.results[0].picture.large
 
        let genero = document.getElementById("genero")
        genero.textContent = res.data.results[0].gender
 
        let fechan = document.getElementById("fechan")
        fechan.textContent = new Date(res.data.results[0].dob.date).toLocaleDateString("es-ES");
 
        let años = document.getElementById("años")
        años.textContent = res.data.results[0].dob.age
 
        let idnombre = document.getElementById("idnombre")
        idnombre.textContent = res.data.results[0].id.name
 
        let nit = document.getElementById("nit")
        nit.textContent = res.data.results[0].id.value
 
        let correo = document.getElementById("correo")
        correo.textContent = res.data.results[0].email
 
        let celular = document.getElementById("celular")
        celular.textContent = res.data.results[0].cell
 
        let pais = document.getElementById("pais")
        pais.textContent = res.data.results[0].location.country
 
        let ciudad = document.getElementById("ciudad")
        ciudad.textContent = res.data.results[0].location.city
 
        let nacionalidad = document.getElementById("nacionalidad")
        nacionalidad.textContent = res.data.results[0].nat
 
        let estado = document.getElementById("estado")
        if (estado) estado.textContent = res.data.results[0].location.state
 
        let codigopostal = document.getElementById("codigopostal")
        codigopostal.textContent = res.data.results[0].location.postcode
 
        let calle = document.getElementById("calle")
        calle.textContent = res.data.results[0].location.street.name
 
        let numero = document.getElementById("numero")
        numero.textContent = res.data.results[0].location.street.number
 
        let latitud = document.getElementById("latitud")
        latitud.textContent = res.data.results[0].location.coordinates.latitude
 
        let longitud = document.getElementById("longitud")
        longitud.textContent = res.data.results[0].location.coordinates.longitude
 
        let telefono = document.getElementById("telefono")
        telefono.textContent = res.data.results[0].phone
 
        let usuario = document.getElementById("usuario")
        usuario.textContent = res.data.results[0].login.username
 
        let password = document.getElementById("password")
        password.textContent = res.data.results[0].login.password
 
        let uuid = document.getElementById("uuid")
        uuid.textContent = res.data.results[0].login.uuid
 
        let registro = document.getElementById("registro")
        registro.textContent = new Date(res.data.results[0].registered.date).toLocaleDateString("es-ES")
 
        let edadregistro = document.getElementById("edadregistro")
        edadregistro.textContent = res.data.results[0].registered.age
 
        let zona = document.getElementById("zona")
        zona.textContent = res.data.results[0].location.timezone.offset
 
        let descripcionzona = document.getElementById("descripcionzona")
        descripcionzona.textContent = res.data.results[0].location.timezone.description
 
    })
 
</script>
 
</body>
</html>
