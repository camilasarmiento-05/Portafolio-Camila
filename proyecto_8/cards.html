<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil de Usuario</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #ffffff;
            color: #333333;
            padding: 20px;
        }

        .btn-volver {
            display: inline-block;
            margin-bottom: 20px;
            padding: 10px 20px;
            background-color: #ffffff;
            border: 1px solid #cccccc;
            border-radius: 4px;
            color: #333333;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-volver:hover {
            background-color: #f0f0f0;
        }

        .tarjeta {
            width: 100%;
            margin: 0;
            border: 1px solid #dddddd;
            overflow: hidden;
        }

        .encabezado {
            background-color: #062e56;
            color: #ffffff;
            padding: 30px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .encabezado #titulo {
            font-size: 17px;
            font-weight: normal;
            margin-bottom: 5px;
        }

        .encabezado #nombre,
        .encabezado #apellido {
            font-size: 35px;
            font-weight: bold;
            line-height: 1.3;
        }

        #perfil {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 3px solid #ffffff;
            object-fit: cover;
            margin-bottom: 15px;
        }

        .contenido {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0;
        }

        .seccion {
            padding: 25px 40px;
            border-bottom: 1px solid #eeeeee;
        }

        .seccion:nth-child(odd) {
            border-right: 1px solid #eeeeee;
        }

        .seccion h3 {
            display: flex;
            justify-content: left;
            font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
            font-size: 18px;
            color: rgb(29, 29, 29);
            font-weight: normal;
        }

        .fila {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #f2f2f2;
            font-size: 16px;
        }

        .fila:last-child {
            border-bottom: none;
        }

        .etiqueta {
            color: #817f7f;
        }

        .valor {
            font-weight: bold;
            text-align: right;
        }

        .contenedor-boton {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }

        #bmapa {
            display: inline-flex;
            width: auto;
            align-items: center;
            gap: 8px;
            margin-top: 16px;
            padding: 10px 38px;
            background: #062e56e4;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s ease;
        }

        #bmapa:hover {
            background: #577ca0;
        }
    </style>
</head>
<body>

    
    <button class="btn-volver" onclick="window.history.back()">← Volver</button>

    <div class="tarjeta">
        <div class="encabezado">
            <img id="perfil" alt="foto de perfil">
            <h1 id="titulo"></h1>
            <h1 id="nombre"></h1>
            <h1 id="apellido"></h1>
        </div>

        <div class="contenido">
            <div class="seccion">
                <h3>Contacto</h3>
                <div class="fila">
                    <span class="etiqueta">Email</span>
                    <span class="valor" id="correo"></span>
                </div>
                <div class="fila">
                    <span class="etiqueta">Teléfono</span>
                    <span class="valor" id="telefono"></span>
                </div>
                <div class="fila">
                    <span class="etiqueta">Celular</span>
                    <span class="valor" id="celular"></span>
                </div>
            </div>

            <div class="seccion">
                <h3>Personal</h3>
                <div class="fila">
                    <span class="etiqueta">Género</span>
                    <span class="valor" id="genero"></span>
                </div>
                <div class="fila">
                    <span class="etiqueta">Edad</span>
                    <span class="valor" id="años"></span>
                </div>
                <div class="fila">
                    <span class="etiqueta">Fecha de Nac.</span>
                    <span class="valor" id="fechan"></span>
                </div>
                <div class="fila">
                    <span class="etiqueta">Nacionalidad</span>
                    <span class="valor" id="nacionalidad"></span>
                </div>
                <div class="fila">
                    <span class="etiqueta" id="idnombre">NIT</span>
                    <span class="valor" id="nit"></span>
                </div>
            </div>

            <div class="seccion">
                <h3>Ubicación</h3>
                <div class="fila">
                    <span class="etiqueta">Dirección</span>
                    <span class="valor"><span id="calle"></span> <span id="numero"></span></span>
                </div>
                <div class="fila">
                    <span class="etiqueta">Ciudad</span>
                    <span class="valor" id="ciudad"></span>
                </div>
                <div class="fila">
                    <span class="etiqueta">País</span>
                    <span class="valor" id="pais"></span>
                </div>
                <div class="fila">
                    <span class="etiqueta">Código postal</span>
                    <span class="valor" id="codigopostal"></span>
                </div>
                <div class="fila">
                    <span class="etiqueta">Coordenadas</span>
                    <span class="valor"><span id="latitud"></span>, <span id="longitud"></span></span>
                </div>
                <div class="fila">
                    <span class="etiqueta">Zona horaria</span>
                    <span class="valor" id="descripcionzona"></span>
                </div>
                <div class="contenedor-boton">
                    <button id="bmapa" onclick="bmapa()" type="button">
                        Ver ubicación en el mapa
                    </button>
                </div>
            </div>

            <div class="seccion">
                <h3>Cuenta</h3>
                <div class="fila">
                    <span class="etiqueta">Usuario</span>
                    <span class="valor" id="usuario"></span>
                </div>
                <div class="fila">
                    <span class="etiqueta">Contraseña</span>
                    <span class="valor" id="password"></span>
                </div>
                <div class="fila">
                    <span class="etiqueta">UUID</span>
                    <span class="valor" id="uuid"></span>
                </div>
                <div class="fila">
                    <span class="etiqueta">Registrado hace</span>
                    <span class="valor"><span id="edadregistro"></span> años (<span id="registro"></span>)</span>
                </div>
                <div class="fila">
                    <span class="etiqueta">Zona</span>
                    <span class="valor" id="zona"></span>
                </div>
            </div>
        </div>
    </div>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        
        let userData = JSON.parse(localStorage.getItem('usuario_seleccionado'));

        if (!userData) {
            window.location.href = 'perfiles.html';
            return;
        }

        document.getElementById("nombre").textContent = userData.name.first;
        document.getElementById("apellido").textContent = userData.name.last;
        document.getElementById("titulo").textContent = userData.name.title;
        document.getElementById("perfil").src = userData.picture.large;
        document.getElementById("genero").textContent = userData.gender;
        document.getElementById("fechan").textContent = new Date(userData.dob.date).toLocaleDateString("es-ES");
        document.getElementById("años").textContent = userData.dob.age;
        
        document.getElementById("idnombre").textContent = userData.id.name || "ID";
        document.getElementById("nit").textContent = userData.id.value || "N/A";
        
        document.getElementById("correo").textContent = userData.email;
        document.getElementById("celular").textContent = userData.cell;
        document.getElementById("telefono").textContent = userData.phone;
        
        document.getElementById("pais").textContent = userData.location.country;
        document.getElementById("ciudad").textContent = userData.location.city;
        document.getElementById("nacionalidad").textContent = userData.nat;
        document.getElementById("codigopostal").textContent = userData.location.postcode;
        document.getElementById("calle").textContent = userData.location.street.name;
        document.getElementById("numero").textContent = userData.location.street.number;
        document.getElementById("latitud").textContent = userData.location.coordinates.latitude;
        document.getElementById("longitud").textContent = userData.location.coordinates.longitude;
        
        document.getElementById("usuario").textContent = userData.login.username;
        document.getElementById("password").textContent = userData.login.password;
        document.getElementById("uuid").textContent = userData.login.uuid;
        document.getElementById("registro").textContent = new Date(userData.registered.date).toLocaleDateString("es-ES");
        document.getElementById("edadregistro").textContent = userData.registered.age;
        document.getElementById("zona").textContent = userData.location.timezone.offset;
        document.getElementById("descripcionzona").textContent = userData.location.timezone.description;
    });

    function bmapa() {
        let latitud = document.getElementById("latitud").textContent;
        let longitud = document.getElementById("longitud").textContent;
        if (latitud && longitud) {
            window.open(`https://www.google.com/maps?q=${latitud},${longitud}`, "_blank");
        }
    }
</script>

</body>
</html>
